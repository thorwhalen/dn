[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "dn"
version = "0.0.1"
description = "Tools for markdown parsing and generation"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "dol",
    "requests",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/thorwhalen/dn"

[project.optional-dependencies]
pdf = [
    "pypdf",
]
word = [
    "mammoth",
]
excel = [
    "pandas",
    "openpyxl",
    "tabulate",
]
powerpoint = [
    "python-pptx",
]
html = [
    "html2text",
]
notebook = [
    "nbconvert",
    "nbformat",
]
all = [
    "pypdf",
    "mammoth",
    "pandas",
    "openpyxl",
    "tabulate",
    "python-pptx",
    "html2text",
    "nbconvert",
    "nbformat",
]
# Alias used by wads CI (install-deps-uv defaults to extras=dev). Pulling in
# all converters lets the test suite exercise every converter path.
dev = [
    "pypdf",
    "mammoth",
    "pandas",
    "openpyxl",
    "tabulate",
    "python-pptx",
    "html2text",
    "nbconvert",
    "nbformat",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "dn"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
    "misc",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
